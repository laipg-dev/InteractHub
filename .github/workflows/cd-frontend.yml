name: CD Frontend Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_REALTIME_BASE_URL: ${{ vars.VITE_REALTIME_BASE_URL }} # ← thêm dòng này

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/InteractHub.Client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/InteractHub.Client

      - name: Build frontend
        run: npm run build
        working-directory: src/InteractHub.Client

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/InteractHub.Client
          output_location: dist
